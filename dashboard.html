<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim System - Full Version</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <!-- Excel Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; background: #fff; border-radius: 4px; }
    .btn-group { display: flex; gap: 5px; margin-top: 10px; }
    .btn-del { color: red; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>報帳系統 (完全版)</h2>
  
  <!-- 欄位輸入區 -->
  <label>購買日期：</label>
  <input type="date" id="dateInput">

  <label>分類：</label>
  <input list="catList" id="catInput" placeholder="請選擇或自行輸入...">
  <datalist id="catList">
    <option value="纸巾"><option value="纸杯"><option value="生日"><option value="衣纸"><option value="油"><option value="蠟燭"><option value="香品">
  </datalist>

  <label>價錢 (HKD)：</label>
  <input type="number" id="priceInput" placeholder="輸入金額">

  <label>上載收據圖片：</label>
  <input type="file" id="fileInput">

  <button onclick="submitClaim()" id="subBtn" style="background:#007bff; color:white; font-weight:bold;">提交單據</button>

  <hr>
  <h3>Excel 下載</h3>
  <label>開始日期：</label>
  <input type="date" id="startD">
  <label>結束日期：</label>
  <input type="date" id="endD">
  <button onclick="exportToExcel()" style="background:#28a745; color:white; font-weight:bold;">下載 Excel 表格</button>

  <h3>歷史紀錄</h3>
  <div id="list">讀取中...</div>
</div>

<script>
  // 【請填入你的 Firebase 設定】
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  
  const db = firebase.firestore();
  const storage = firebase.storage();

  // 功能 1 & 2: 提交資料與自動改名
  async function submitClaim() {
    const d = document.getElementById('dateInput').value;
    const c = document.getElementById('catInput').value;
    const p = document.getElementById('priceInput').value;
    const f = document.getElementById('fileInput').files[0];

    if(!d || !c || !p || !f) {
      alert("請填寫完整資訊！");
      return;
    }
    
    document.getElementById('subBtn').innerText = "上傳中，請稍候...";
    
    // 檔名格式處理：YYMMDD分類價錢.副檔名
    const dateObj = new Date(d);
    const fileName = `${String(dateObj.getFullYear()).slice(-2)}${String(dateObj.getMonth()+1).padStart(2,'0')}${String(dateObj.getDate()).padStart(2,'0')}${c}${p}.${f.name.split('.').pop()}`;
    
    // 上傳至 Storage
    const ref = storage.ref('claims/' + fileName);
    await ref.put(f);
    const url = await ref.getDownloadURL();
    
    // 寫入 Firestore
    await db.collection('claims').add({ 
      date: d, 
      category: c, 
      price: Number(p), 
      url: url, 
      name: fileName 
    });
    
    alert("單據提交成功！");
    location.reload();
  }

  // 功能 4 & 5: 渲染列表與功能
  db.collection('claims').onSnapshot(snap => {
    const list = document.getElementById('list');
    list.innerHTML = '';
    
    snap.forEach(doc => {
      const d = doc.data();
      const id = doc.id;
      
      list.innerHTML += `
        <div class="card">
          <p><strong>日期：</strong> ${d.date} | <strong>分類：</strong> ${d.category} | <strong>價錢：</strong> $${d.price}</p>
          <div class="btn-group">
            <button onclick="toggleImg('${id}')">查看圖片</button>
            <button onclick="window.open('${d.url}', '_blank')">下載圖片</button>
            <button class="btn-del" onclick="del('${id}', '${d.name}')">刪除單據</button>
          </div>
          <img id="img-${id}" src="${d.url}" style="display:none; width:100%; margin-top:10px;">
        </div>
      `;
    });
  });

  function toggleImg(id) {
    const el = document.getElementById('img-'+id);
    if (el.style.display === 'block') {
      el.style.display = 'none';
    } else {
      el.style.display = 'block';
    }
  }

  async function del(id, name) {
    if(!confirm("確定要刪除這筆單據嗎？")) return;
    await db.collection('claims').doc(id).delete();
    await storage.ref('claims/' + name).delete();
    location.reload();
  }

  // 功能 3: Excel 下載 (日期篩選)
  async function exportToExcel() {
    const s = document.getElementById('startD').value;
    const e = document.getElementById('endD').value;
    
    if(!s || !e) {
      alert("請選擇開始與結束日期！");
      return;
    }
    
    const snap = await db.collection('claims')
      .where("date", ">=", s)
      .where("date", "<=", e)
      .get();
      
    const data = [];
    snap.forEach(d => data.push(d.data()));
    
    if(data.length === 0) {
      alert("該範圍內無資料！");
      return;
    }
    
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Claims");
    XLSX.writeFile(wb, `Export_${s}_to_${e}.xlsx`);
  }
</script>
</body>
</html>
