<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統儀表板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f9f9f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        h1 { margin: 0; font-size: 18px; }
        .user-badge { font-size: 13px; color: #666; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; margin-right: 10px; }
        .logout-btn { background: #ff4d4f; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .logout-btn:hover { background: #d9363e; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <h1>系統儀表板</h1>
    <div>
        <span id="role-display" class="user-badge">載入中...</span>
        <button class="logout-btn" onclick="logout()">登出</button>
    </div>
</header>

<div class="container">
    <div class="card">
        <h2>歡迎使用索償系統</h2>
        <p id="welcome-msg">已成功進入系統後台。</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRmm7eV-Yw0LG0Y2mFwcnt5pew2Y1as1w",
        authDomain: "new-claim-dcc61.firebaseapp.com",
        projectId: "new-claim-dcc61",
        storageBucket: "new-claim-dcc61.firebasestorage.app",
        messagingSenderId: "589308572721",
        appId: "1:589308572721:web:4da5c6d74711134f0dd110",
        measurementId: "G-RBJV5E2VKL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 頁面載入時檢查登入權限
    const role = sessionStorage.getItem('role');
    const roleDisplay = document.getElementById('role-display');

    if (!role) {
        alert('請先登入！');
        window.location.href = 'index.html';
    } else {
        if (role === 'admin') {
            roleDisplay.innerText = '身份：管理員 (Admin)';
        } else {
            // 會員身份，確認 Firebase Auth 狀態
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    roleDisplay.innerText = `會員：${user.email}`;
                } else if (role !== 'admin') {
                    alert('登入狀態已失效，請重新登入');
                    window.location.href = 'index.html';
                }
            });
        }
    }

    // 登出功能
    window.logout = async () => {
        try {
            await signOut(auth);
            sessionStorage.removeItem('role');
            alert('已成功登出！');
            window.location.href = 'index.html';
        } catch (e) {
            alert('登出失敗: ' + e.message);
        }
    };
</script>

</body>
</html>
