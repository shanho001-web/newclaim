<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim System - Dashboard</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <!-- 匯出與壓縮函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input:disabled { background-color: #e9ecef; cursor: not-allowed; }
    .card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; background: #fff; border-radius: 4px; }
    .btn-group { display: flex; gap: 5px; margin-top: 10px; }
    .btn-del { color: red; font-weight: bold; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { width: auto; background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .export-btn-group { display: flex; gap: 10px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
    .summary-box { padding: 12px; border-radius: 6px; text-align: center; color: white; font-weight: bold; }
    .bg-in { background-color: #28a745; }
    .bg-out { background-color: #dc3545; }
    .bg-bal { background-color: #007bff; }
    .summary-box span { display: block; font-size: 12px; font-weight: normal; margin-bottom: 4px; }
    .summary-box div { font-size: 18px; }
    .badge { padding: 3px 8px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; display: inline-block; }
    .badge-in { background: #28a745; }
    .badge-out { background: #dc3545; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2>收支與報帳系統</h2>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>

  <!-- 財務總覽 (僅 Admin 可見) -->
  <div id="summarySection" class="summary-grid">
    <div class="summary-box bg-in"><span>總收入</span><div id="stat-in">$0</div></div>
    <div class="summary-box bg-out"><span>總支出</span><div id="stat-out">$0</div></div>
    <div class="summary-box bg-bal"><span>當前結餘</span><div id="stat-bal">$0</div></div>
  </div>
  
  <!-- 輸入區 -->
  <label>交易類型：</label>
  <select id="typeInput" onchange="toggleTypeUI()">
    <option value="out">支出 (報帳/記帳)</option>
    <option value="in" id="optIncome">收入 (入數/存入)</option>
  </select>

  <label>填寫人姓名：</label>
  <input type="text" id="userInput" disabled>

  <label>日期：</label>
  <input type="date" id="dateInput">

  <label>分類：</label>
  <input list="catList" id="catInput" placeholder="請選擇或自行輸入...">
  <datalist id="catList">
    <option value="紙巾"><option value="紙杯"><option value="生日"><option value="衣紙"><option value="油"><option value="蠟燭"><option value="香品"><option value="資金補充"><option value="其他收入">
  </datalist>

  <label>金額 (HKD)：</label>
  <input type="number" id="priceInput" placeholder="輸入金額">

  <label id="fileLabel">上載收據圖片：</label>
  <input type="file" id="fileInput">

  <button onclick="submitClaim()" id="subBtn" style="background:#007bff; color:white; font-weight:bold;">提交紀錄</button>

  <!-- 匯出專區 (僅 Admin 可見) -->
  <div id="exportSection">
    <hr>
    <h3>報表與圖片批次下載</h3>
    <label>開始日期：</label><input type="date" id="startD">
    <label>結束日期：</label><input type="date" id="endD">
    <div class="export-btn-group">
      <button onclick="exportToExcel()" style="background:#28a745; color:white; font-weight:bold;">下載 Excel 表格</button>
      <button onclick="exportImagesZip()" id="zipBtn" style="background:#17a2b8; color:white; font-weight:bold;">下載圖片 ZIP 包</button>
    </div>
  </div>

  <hr>
  <h3>歷史紀錄</h3>
  <div id="list">讀取中...</div>
</div>

<script>
  const role = sessionStorage.getItem('role');
  const currentUserName = sessionStorage.getItem('username') || '';

  if (!role || !currentUserName) {
    alert("請先登入系統！");
    window.location.href = "index.html";
  }

  window.addEventListener('DOMContentLoaded', () => {
    // 鎖定姓名欄位，禁止修改
    document.getElementById('userInput').value = currentUserName;

    if (role !== 'admin') {
      document.getElementById('summarySection').style.display = 'none';
      document.getElementById('exportSection').style.display = 'none';
      const optIncome = document.getElementById('optIncome');
      if (optIncome) optIncome.remove();
    }
  });

  function logout() {
    sessionStorage.clear();
    window.location.href = "index.html";
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBRmm7eV-Yw0LG0Y2mFwcnt5pew2Y1as1w",
    authDomain: "new-claim-dcc61.firebaseapp.com",
    projectId: "new-claim-dcc61",
    storageBucket: "new-claim-dcc61.firebasestorage.app",
    messagingSenderId: "589308572721",
    appId: "1:589308572721:web:4da5c6d74711134f0dd110",
    measurementId: "G-RBJV5E2VKL"
  };
  
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  function toggleTypeUI() {
    const type = document.getElementById('typeInput').value;
    document.getElementById('fileLabel').innerText = (type === 'in') ? "上載入數紙/證明圖片 (可選)：" : "上載收據圖片：";
  }

  async function submitClaim() {
    const type = document.getElementById('typeInput').value;
    const d = document.getElementById('dateInput').value;
    const c = document.getElementById('catInput').value;
    const p = document.getElementById('priceInput').value;
    const f = document.getElementById('fileInput').files[0];

    if(!d || !c || !p) return alert("請填寫日期、分類與金額！");
    if(type === 'out' && !f) return alert("支出記錄請提供收據圖片！");
    
    document.getElementById('subBtn').innerText = "處理中，請稍候...";
    
    let url = "";
    let fileName = "";

    if (f) {
      const dateObj = new Date(d);
      const prefix = type === 'in' ? '入數' : c;
      fileName = `${String(dateObj.getFullYear()).slice(-2)}${String(dateObj.getMonth()+1).padStart(2,'0')}${String(dateObj.getDate()).padStart(2,'0')}${prefix}${p}.${f.name.split('.').pop()}`;
      
      try {
        const ref = storage.ref('claims/' + fileName);
        await ref.put(f);
        url = await ref.getDownloadURL();
      } catch (err) {
        alert("圖片上載失敗: " + err.message);
        document.getElementById('subBtn').innerText = "提交紀錄";
        return;
      }
    }
    
    try {
      await db.collection('claims').add({ 
        type: type, 
        userName: currentUserName, 
        date: d, 
        category: c, 
        price: Number(p), 
        url: url, 
        name: fileName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      alert("紀錄提交成功！");
      location.reload();
    } catch (err) {
      alert("提交失敗: " + err.message);
      document.getElementById('subBtn').innerText = "提交紀錄";
    }
  }

  // 實時數據庫監聽與隔離
  db.collection('claims').onSnapshot(snap => {
    const list = document.getElementById('list');
    list.innerHTML = '';
    
    let totalIn = 0;
    let totalOut = 0;

    const docsArr = [];
    snap.forEach(doc => {
      const data = doc.data();
      // 會員只看自己填寫的單據，Admin 可看所有單據
      if (role === 'admin' || data.userName === currentUserName) {
        docsArr.push({ id: doc.id, ...data });
      }
    });

    docsArr.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (docsArr.length === 0) {
      list.innerHTML = '<p style="color:#666;">目前無相關紀錄。</p>';
      return;
    }

    docsArr.forEach(d => {
      const isIncome = d.type === 'in';
      const amt = Number(d.price) || 0;

      if (isIncome) totalIn += amt;
      else totalOut += amt;
      
      list.innerHTML += `
        <div class="card">
          <p>
            <span class="badge ${isIncome ? 'badge-in' : 'badge-out'}">${isIncome ? '收入' : '支出'}</span>
            <strong>日期：</strong> ${d.date} | <strong>經辦人：</strong> ${d.userName || '-'} | 
            <strong>分類：</strong> ${d.category} | 
            <strong>金額：</strong> <span style="color:${isIncome ? '#28a745' : '#dc3545'}; font-weight:bold;">${isIncome ? '+' : '-'}$${amt}</span>
          </p>
          <div class="btn-group">
            ${d.url ? `<button onclick="toggleImg('${d.id}')">查看圖片</button>` : ''}
            ${d.url ? `<button onclick="downloadImg('${d.url}', '${d.name}')">下載圖片</button>` : ''}
            <button class="btn-del" onclick="del('${d.id}', '${d.name}')">刪除紀錄</button>
          </div>
          ${d.url ? `<img id="img-${d.id}" src="${d.url}" style="display:none; width:100%; margin-top:10px;">` : ''}
        </div>
      `;
    });

    if (role === 'admin') {
      document.getElementById('stat-in').innerText = `$${totalIn}`;
      document.getElementById('stat-out').innerText = `$${totalOut}`;
      document.getElementById('stat-bal').innerText = `$${totalIn - totalOut}`;
    }
  });

  function toggleImg(id) {
    const el = document.getElementById('img-'+id);
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  }

  async function downloadImg(url, fileName) {
    try {
      const response = await fetch(url);
      const blob = await response.blob();
      const blobUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(blobUrl);
    } catch (e) {
      window.open(url, '_blank');
    }
  }

  async function del(id, name) {
    if(!confirm("確定要刪除這筆紀錄嗎？")) return;
    try {
      await db.collection('claims').doc(id).delete();
      if(name) await storage.ref('claims/' + name).delete();
      location.reload();
    } catch (e) {
      alert("刪除失敗：" + e.message);
    }
  }

  // Excel 匯出 (修復 CDN 後正常運行)
  async function exportToExcel() {
    if (role !== 'admin') return alert("僅限管理員匯出！");
    const s = document.getElementById('startD').value;
    const e = document.getElementById('endD').value;
    if(!s || !e) return alert("請選擇開始與結束日期！");
    
    try {
      const snap = await db.collection('claims').where("date", ">=", s).where("date", "<=", e).get();
      if(snap.empty) return alert("該範圍內無資料！");

      const records = [];
      snap.forEach(doc => records.push(doc.data()));
      records.sort((a, b) => new Date(a.date) - new Date(b.date));

      const rows = [
        ["日期", "經辦人", "類型", "分類", "收入 (HKD)", "支出 (HKD)", "結餘 (HKD)", "證明/收據檔名", "點擊查看圖片"]
      ];

      let currentBalance = 0;
      records.forEach(d => {
        const isIncome = (d.type === 'in');
        const amt = Number(d.price) || 0;
        const incomeAmt = isIncome ? amt : 0;
        const expenseAmt = !isIncome ? amt : 0;
        currentBalance += (incomeAmt - expenseAmt);

        rows.push([
          d.date || "", d.userName || "-", isIncome ? "收入" : "支出", d.category || "",
          incomeAmt, expenseAmt, currentBalance, d.name || "無圖片", d.url || ""
        ]);
      });

      const lastRowIndex = rows.length;
      rows.push([
        "總計", "-", "-", "-", 
        `=SUM(E2:E${lastRowIndex})`, 
        `=SUM(F2:F${lastRowIndex})`, 
        `=E${lastRowIndex+1}-F${lastRowIndex+1}`, 
        "-", "-"
      ]);

      const ws = XLSX.utils.aoa_to_sheet(rows);
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let R = 1; R <= range.e.r - 1; ++R) {
        const cellRef = XLSX.utils.encode_cell({ r: R, c: 8 });
        if (ws[cellRef] && ws[cellRef].v) {
          const url = ws[cellRef].v;
          ws[cellRef] = { t: 's', v: '點擊查看圖片', l: { Target: url, Tooltip: '開啟圖片' } };
        }
      }

      ws['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 15 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 25 }, { wch: 18 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "收支報表");
      XLSX.writeFile(wb, `Financial_Report_${s}_to_${e}.xlsx`);
    } catch (err) {
      alert("Excel 匯出失敗：" + err.message);
    }
  }

  // ZIP 下載 (修復 CDN 後正常運行)
  async function exportImagesZip() {
    if (role !== 'admin') return alert("僅限管理員下載！");
    const s = document.getElementById('startD').value;
    const e = document.getElementById('endD').value;
    const zipBtn = document.getElementById('zipBtn');
    if(!s || !e) return alert("請選擇開始與結束日期！");

    zipBtn.innerText = "搜尋單據中...";
    zipBtn.disabled = true;

    try {
      const snap = await db.collection('claims').where("date", ">=", s).where("date", "<=", e).get();
      if(snap.empty) {
        alert("該範圍內無單據圖片！");
        zipBtn.innerText = "下載圖片 ZIP 包";
        zipBtn.disabled = false;
        return;
      }

      const zip = new JSZip();
      let completed = 0;
      const total = snap.docs.length;

      const downloadPromises = snap.docs.map(async doc => {
        const d = doc.data();
        if (d.name && d.url) {
          try {
            const res = await fetch(d.url);
            const blob = await res.blob();
            zip.file(d.name, blob);
          } catch(e){}
          completed++;
          zipBtn.innerText = `下載中 (${completed}/${total})...`;
        }
      });

      await Promise.all(downloadPromises);
      zipBtn.innerText = "生成 ZIP 壓縮包中...";
      const zipContent = await zip.generateAsync({ type: "blob" });
      saveAs(zipContent, `Receipt_Images_${s}_to_${e}.zip`);
    } catch (err) {
      alert("打包失敗：" + err.message);
    } finally {
      zipBtn.innerText = "下載圖片 ZIP 包";
      zipBtn.disabled = false;
    }
  }
</script>
</body>
</html>
