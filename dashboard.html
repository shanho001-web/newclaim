<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim System - Complete Version</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <!-- Excel Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; background: #fff; border-radius: 4px; }
    .btn-group { display: flex; gap: 5px; margin-top: 10px; }
    .btn-del { color: red; font-weight: bold; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { width: auto; background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .export-btn-group { display: flex; gap: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2>報帳系統 (完全版)</h2>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>
  
  <!-- 欄位輸入區 -->
  <label>購買日期：</label>
  <input type="date" id="dateInput">

  <label>分類：</label>
  <input list="catList" id="catInput" placeholder="請選擇或自行輸入...">
  <datalist id="catList">
    <option value="纸巾"><option value="纸杯"><option value="生日"><option value="衣纸"><option value="油"><option value="蠟燭"><option value="香品">
  </datalist>

  <label>價錢 (HKD)：</label>
  <input type="number" id="priceInput" placeholder="輸入金額">

  <label>上載收據圖片：</label>
  <input type="file" id="fileInput">

  <button onclick="submitClaim()" id="subBtn" style="background:#007bff; color:white; font-weight:bold;">提交單據</button>

  <hr>
  <h3>報表與圖片批次下載</h3>
  <label>開始日期：</label>
  <input type="date" id="startD">
  <label>結束日期：</label>
  <input type="date" id="endD">
  
  <div class="export-btn-group">
    <button onclick="exportToExcel()" style="background:#28a745; color:white; font-weight:bold;">下載 Excel 表格</button>
    <button onclick="exportImagesZip()" id="zipBtn" style="background:#17a2b8; color:white; font-weight:bold;">下載圖片 ZIP 包</button>
  </div>

  <h3>歷史紀錄</h3>
  <div id="list">讀取中...</div>
</div>

<script>
  // 權限驗證：未登入者強制導回 index.html
  const role = sessionStorage.getItem('role');
  if (!role) {
    alert("請先登入系統！");
    window.location.href = "index.html";
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = "index.html";
  }

  // Firebase 設定
  const firebaseConfig = {
    apiKey: "AIzaSyBRmm7eV-Yw0LG0Y2mFwcnt5pew2Y1as1w",
    authDomain: "new-claim-dcc61.firebaseapp.com",
    projectId: "new-claim-dcc61",
    storageBucket: "new-claim-dcc61.firebasestorage.app",
    messagingSenderId: "589308572721",
    appId: "1:589308572721:web:4da5c6d74711134f0dd110",
    measurementId: "G-RBJV5E2VKL"
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  
  const db = firebase.firestore();
  const storage = firebase.storage();

  // 提交單據與自動命名
  async function submitClaim() {
    const d = document.getElementById('dateInput').value;
    const c = document.getElementById('catInput').value;
    const p = document.getElementById('priceInput').value;
    const f = document.getElementById('fileInput').files[0];

    if(!d || !c || !p || !f) {
      alert("請填寫完整資訊！");
      return;
    }
    
    document.getElementById('subBtn').innerText = "上傳中，請稍候...";
    
    // 檔名格式：YYMMDD分類價錢.副檔名
    const dateObj = new Date(d);
    const fileName = `${String(dateObj.getFullYear()).slice(-2)}${String(dateObj.getMonth()+1).padStart(2,'0')}${String(dateObj.getDate()).padStart(2,'0')}${c}${p}.${f.name.split('.').pop()}`;
    
    try {
      const ref = storage.ref('claims/' + fileName);
      await ref.put(f);
      const url = await ref.getDownloadURL();
      
      await db.collection('claims').add({ 
        date: d, 
        category: c, 
        price: Number(p), 
        url: url, 
        name: fileName 
      });
      
      alert("單據提交成功！");
      location.reload();
    } catch (err) {
      alert("上傳失敗: " + err.message);
      document.getElementById('subBtn').innerText = "提交單據";
    }
  }

  // 渲染歷史紀錄
  db.collection('claims').onSnapshot(snap => {
    const list = document.getElementById('list');
    list.innerHTML = '';
    
    snap.forEach(doc => {
      const d = doc.data();
      const id = doc.id;
      
      list.innerHTML += `
        <div class="card">
          <p><strong>日期：</strong> ${d.date} | <strong>分類：</strong> ${d.category} | <strong>價錢：</strong> $${d.price}</p>
          <div class="btn-group">
            <button onclick="toggleImg('${id}')">查看圖片</button>
            <button onclick="downloadImg('${d.url}', '${d.name}')">下載圖片</button>
            <button class="btn-del" onclick="del('${id}', '${d.name}')">刪除單據</button>
          </div>
          <img id="img-${id}" src="${d.url}" style="display:none; width:100%; margin-top:10px;">
        </div>
      `;
    });
  });

  function toggleImg(id) {
    const el = document.getElementById('img-'+id);
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  }

  // 強制觸發單張圖片下載
  async function downloadImg(url, fileName) {
    try {
      const response = await fetch(url);
      const blob = await response.blob();
      const blobUrl = window.URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(blobUrl);
    } catch (e) {
      window.open(url, '_blank');
    }
  }

  async function del(id, name) {
    if(!confirm("確定要刪除這筆單據嗎？")) return;
    try {
      await db.collection('claims').doc(id).delete();
      await storage.ref('claims/' + name).delete();
      location.reload();
    } catch (e) {
      alert("刪除失敗：" + e.message);
    }
  }

  // 防亂碼 + 格式排版 Excel 下載
  async function exportToExcel() {
    const s = document.getElementById('startD').value;
    const e = document.getElementById('endD').value;
    
    if(!s || !e) {
      alert("請選擇開始與結束日期！");
      return;
    }
    
    const snap = await db.collection('claims')
      .where("date", ">=", s)
      .where("date", "<=", e)
      .get();
      
    if(snap.empty) {
      alert("該範圍內無資料！");
      return;
    }
    
    const rows = [
      ["購買日期", "分類", "金額 (HKD)", "圖片檔名", "點擊查看圖片"]
    ];

    snap.forEach(doc => {
      const d = doc.data();
      rows.push([
        d.date || "",
        d.category || "",
        Number(d.price) || 0,
        d.name || "",
        d.url || ""
      ]);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);

    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let R = 1; R <= range.e.r; ++R) {
      const cellRef = XLSX.utils.encode_cell({ r: R, c: 4 });
      if (ws[cellRef] && ws[cellRef].v) {
        const url = ws[cellRef].v;
        ws[cellRef] = {
          t: 's',
          v: '點擊查看圖片',
          l: { Target: url, Tooltip: '開啟收據圖片' }
        };
      }
    }

    ws['!cols'] = [
      { wch: 15 },
      { wch: 15 },
      { wch: 15 },
      { wch: 30 },
      { wch: 20 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "報帳紀錄");
    
    XLSX.writeFile(wb, `Claim_Report_${s}_to_${e}.xlsx`, { bookType: 'xlsx', type: 'binary' });
  }

  // 輔助函式：可靠地取得圖片 Blob (雙重備用機制)
  function fetchImageBlob(url) {
    return new Promise((resolve, reject) => {
      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("HTTP error " + res.status);
          return res.blob();
        })
        .then(blob => resolve(blob))
        .catch(() => {
          // 若 fetch 被 CORS 擋下，使用 Image + Canvas 機制載入
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            canvas.toBlob(blob => {
              if (blob) resolve(blob);
              else reject(new Error("Canvas toBlob 失敗"));
            }, "image/jpeg", 0.95);
          };
          img.onerror = () => reject(new Error("圖片載入失敗"));
          img.src = url;
        });
    });
  }

  // 下載指定日期範圍內所有圖片的 ZIP 壓縮包
  async function exportImagesZip() {
    const s = document.getElementById('startD').value;
    const e = document.getElementById('endD').value;
    const zipBtn = document.getElementById('zipBtn');
    
    if(!s || !e) {
      alert("請選擇開始與結束日期！");
      return;
    }

    zipBtn.innerText = "搜尋單據中...";
    zipBtn.disabled = true;

    try {
      const snap = await db.collection('claims')
        .where("date", ">=", s)
        .where("date", "<=", e)
        .get();
        
      if(snap.empty) {
        alert("該範圍內無單據資料！");
        zipBtn.innerText = "下載圖片 ZIP 包";
        zipBtn.disabled = false;
        return;
      }

      const zip = new JSZip();
      let completed = 0;
      const total = snap.docs.length;

      zipBtn.innerText = `準備下載 (0/${total})...`;

      // 使用 Promise.all 並行處理解析所有圖片
      const downloadPromises = snap.docs.map(async doc => {
        const d = doc.data();
        if (d.url && d.name) {
          try {
            const blob = await fetchImageBlob(d.url);
            zip.file(d.name, blob);
            completed++;
            zipBtn.innerText = `下載中 (${completed}/${total})...`;
          } catch (err) {
            console.error("無法載入圖片：", d.name, err);
          }
        }
      });

      await Promise.all(downloadPromises);

      if (Object.keys(zip.files).length === 0) {
        alert("無法獲取圖片檔案，請確認 Firebase Storage CORS 權限或圖片連結有效。");
        return;
      }

      zipBtn.innerText = "生成 ZIP 壓縮包中...";
      const zipContent = await zip.generateAsync({ type: "blob" });
      saveAs(zipContent, `Receipt_Images_${s}_to_${e}.zip`);

    } catch (err) {
      alert("打包失敗：" + err.message);
    } finally {
      zipBtn.innerText = "下載圖片 ZIP 包";
      zipBtn.disabled = false;
    }
  }
</script>
</body>
</html>
